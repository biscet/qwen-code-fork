<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Qwen Code</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #080808;
        color: #f2f2f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background: #080808;
      }

      main {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 48px;
      }

      .shell {
        width: min(640px, 100%);
        padding: 32px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        background: #161616;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.025),
          0 18px 48px rgba(0, 0, 0, 0.28);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .mark {
        display: block;
        width: 54px;
        height: 54px;
        flex: 0 0 auto;
      }

      .mark-tile {
        fill: #08080a;
        stroke: rgba(255, 255, 255, 0.1);
      }

      .mark-bracket-left {
        fill: #d3d3d5;
      }

      .mark-bracket-right {
        fill: #f4f4f5;
      }

      .mark-pixel {
        fill: #77777a;
      }

      body[data-state='starting'] .brand-copy,
      body[data-state='starting'] .actions,
      body[data-state='starting'] footer {
        display: none;
      }

      body[data-state='starting'] .shell {
        width: auto;
        padding: 0;
        border: 0;
        background: none;
        box-shadow: none;
      }

      body[data-state='starting'] .mark {
        width: 72px;
        height: 72px;
      }

      body[data-state='starting'] .mark-bracket-left {
        animation: homecode-lock-left 1.6s ease-in-out infinite;
      }

      body[data-state='starting'] .mark-bracket-right {
        animation: homecode-lock-right 1.6s ease-in-out infinite;
      }

      body[data-state='starting'] .mark-pixel-top {
        animation: homecode-pixel-top 1.6s ease-in-out infinite;
      }

      body[data-state='starting'] .mark-pixel-bottom {
        animation: homecode-pixel-bottom 1.6s ease-in-out infinite;
      }

      body[data-state='starting'] .status {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        border: 0;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      @keyframes homecode-lock-left {
        0%,
        100% {
          opacity: 0.68;
        }
        48%,
        70% {
          opacity: 1;
        }
      }

      @keyframes homecode-lock-right {
        0%,
        100% {
          opacity: 1;
        }
        48%,
        70% {
          opacity: 0.68;
        }
      }

      @keyframes homecode-pixel-top {
        0%,
        24%,
        100% {
          opacity: 0.32;
        }
        42%,
        70% {
          opacity: 0.9;
        }
      }

      @keyframes homecode-pixel-bottom {
        0%,
        38%,
        100% {
          opacity: 0.32;
        }
        54%,
        82% {
          opacity: 0.9;
        }
      }

      h1 {
        margin: 0;
        font-size: 27px;
        font-weight: 600;
        letter-spacing: -0.035em;
      }

      .eyebrow {
        margin: 3px 0 0;
        color: #808080;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .status {
        display: grid;
        grid-template-columns: 14px minmax(0, 1fr);
        gap: 14px;
        margin-top: 32px;
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        background: #101010;
      }

      .pulse {
        width: 10px;
        height: 10px;
        margin-top: 5px;
        border-radius: 2px;
        background: #a2bcff;
        animation: status-pixel 1.35s ease-in-out infinite;
      }

      .pulse.error {
        background: #f17471;
        animation: none;
      }

      .pulse.idle {
        background: #49c970;
        animation: none;
      }

      @keyframes status-pixel {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.78);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      #detail {
        margin: 7px 0 0;
        color: #aeaeae;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      .workspace {
        margin-top: 18px;
        padding: 10px 12px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 6px;
        background: #1c1c1c;
        color: #aeaeae;
        font:
          12px/1.5 ui-monospace,
          'SFMono-Regular',
          Consolas,
          monospace;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 22px;
      }

      button {
        appearance: none;
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        background: #242424;
        color: #f2f2f2;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        cursor: pointer;
        transition:
          border-color 120ms ease,
          background 120ms ease;
      }

      button:hover {
        border-color: rgba(255, 255, 255, 0.2);
        background: #2e2e2e;
      }

      button:focus-visible {
        outline: 2px solid #7698fd;
        outline-offset: 2px;
      }

      button.primary {
        border-color: #ededed;
        background: #ededed;
        color: #161616;
      }

      button.primary:hover {
        background: #ffffff;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-top: 28px;
        color: #808080;
        font-size: 12px;
      }

      #error {
        display: none;
        margin-top: 16px;
        color: #f17471;
        font:
          12px/1.55 ui-monospace,
          monospace;
        white-space: pre-wrap;
      }

      @media (prefers-reduced-motion: reduce) {
        body[data-state='starting'] .mark-bracket-left,
        body[data-state='starting'] .mark-bracket-right,
        body[data-state='starting'] .mark-pixel,
        .pulse {
          animation: none;
          opacity: 1;
          transform: none;
        }

        body[data-state='starting'] .brand {
          justify-content: center;
        }

        body[data-state='starting'] .status {
          position: static;
          width: auto;
          height: auto;
          margin: 18px 0 0;
          overflow: visible;
          clip: auto;
          clip-path: none;
          color: #808080;
          white-space: normal;
          text-align: center;
        }

        body[data-state='starting'] .status > :first-child,
        body[data-state='starting'] .status > div > :not(#title) {
          display: none;
        }

        body[data-state='starting'] #title {
          font-size: 13px;
          font-weight: 500;
        }
      }

      @media (max-width: 640px) {
        main {
          padding: 22px;
        }
        .shell {
          padding: 24px;
        }
        footer {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body data-state="starting">
    <main>
      <section class="shell" aria-live="polite">
        <div class="brand">
          <svg
            class="mark"
            viewBox="0 0 100 100"
            role="img"
            aria-label="Qwen Code"
          >
            <rect
              class="mark-tile"
              x="4"
              y="4"
              width="92"
              height="92"
              rx="20"
            />
            <path
              class="mark-bracket-left"
              d="M56.6 24.7H27.1V63.6H43.5V55H34.9V33.5H56.6V24.7Z"
            />
            <path
              class="mark-bracket-right"
              d="M56.6 40.1H72.9V78.9H43.5V70H65V48.8H56.6V40.1Z"
            />
            <rect
              class="mark-pixel mark-pixel-top"
              x="40.3"
              y="40.1"
              width="8.5"
              height="8.7"
            />
            <rect
              class="mark-pixel mark-pixel-bottom"
              x="51.1"
              y="55"
              width="8.6"
              height="8.6"
            />
          </svg>
          <div class="brand-copy">
            <h1>Qwen Code</h1>
            <p class="eyebrow">Desktop workspace</p>
          </div>
        </div>
        <div class="status">
          <div id="pulse" class="pulse"></div>
          <div>
            <h2 id="title">Starting Qwen Code</h2>
            <p id="detail">
              Preparing the local workspace and bundled runtime…
            </p>
            <div id="workspace" class="workspace" hidden></div>
            <pre id="error"></pre>
          </div>
        </div>
        <div class="actions">
          <button id="choose" class="primary" hidden>
            Choose another workspace
          </button>
          <button id="retry" hidden>Retry</button>
          <button id="logs">Open logs</button>
          <button id="update" hidden>Install update</button>
        </div>
        <footer>
          <span id="version">Desktop</span
          ><span>Local daemon · authenticated loopback</span>
        </footer>
      </section>
    </main>
    <script src="./bootstrap.js"></script>
  </body>
</html>
